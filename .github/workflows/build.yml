name: Build Zygisk Module

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Prepare Source & Build Native Libraries
        run: |
          echo "=== Locating Android.mk ==="
          MK_FILE=$(find . -name "Android.mk" -not -path "*/.git/*" | head -n 1)
          if [ -z "$MK_FILE" ]; then
            echo "ERROR: Android.mk was not found anywhere in the repository!"
            echo "Here are the files currently in the repository:"
            ls -la
            exit 1
          fi
          echo "Found Android.mk at: $MK_FILE"
          SRC_DIR=$(dirname "$MK_FILE")

          # Ensure files are placed in ./jni for ndk-build
          if [ "$SRC_DIR" != "./jni" ]; then
            echo "Organizing files into ./jni..."
            mkdir -p jni
            cp -r "$SRC_DIR"/* jni/ 2>/dev/null || true
          fi

          # Run NDK build
          ndk-build NDK_PROJECT_PATH=. -B

      - name: Package Flashable Zip
        run: |
          mkdir -p package/zygisk

          # Copy compiled libraries
          if [ -d "libs/arm64-v8a" ]; then
            cp libs/arm64-v8a/*.so package/zygisk/arm64-v8a.so
          fi
          if [ -d "libs/armeabi-v7a" ]; then
            cp libs/armeabi-v7a/*.so package/zygisk/armeabi-v7a.so
          fi

          # Find and copy module.prop and customize.sh
          PROP_FILE=$(find . -name "module.prop" -not -path "*/package/*" | head -n 1)
          if [ -n "$PROP_FILE" ]; then
            cp "$PROP_FILE" package/module.prop
          fi

          SH_FILE=$(find . -name "customize.sh" -not -path "*/package/*" | head -n 1)
          if [ -n "$SH_FILE" ]; then
            cp "$SH_FILE" package/customize.sh
          fi

          cd package
          zip -r ../MLBB_OnePlus15_Zygisk_v1.0.zip ./*

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLBB_OnePlus15_Zygisk_v1.0
          path: MLBB_OnePlus15_Zygisk_v1.0.zip
